<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Movie Rating Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🎬 Movie Predictor</h1>
            <p class="subtitle">Predict IMDb ratings using Machine Learning</p>
            
            <form id="prediction-form">
                <div class="form-group">
                    <label for="budget">Budget (in Million USD)</label>
                    <input type="number" id="budget" name="budget" placeholder="e.g. 150" step="0.1" required>
                    <div id="budget-error" class="error-message">Please enter a valid budget</div>
                </div>
                
                <div class="form-group">
                    <label for="duration">Duration (in Minutes)</label>
                    <input type="number" id="duration" name="duration" placeholder="e.g. 120" step="1" required>
                    <div id="duration-error" class="error-message">Please enter a valid duration</div>
                </div>
                
                <button type="submit" class="predict-btn" id="predict-btn">Predict Rating</button>
            </form>
            
            <div id="result-container" class="result-container">
                <p class="result-label">Predicted Rating</p>
                <div id="result-value" class="result-value">-.--</div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('prediction-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Reset UI
            const resultContainer = document.getElementById('result-container');
            const resultValue = document.getElementById('result-value');
            const predictBtn = document.getElementById('predict-btn');
            
            resultContainer.classList.remove('show');
            
            const budget = document.getElementById('budget').value;
            const duration = document.getElementById('duration').value;
            
            // Basic Validation
            if (!budget || budget <= 0) {
                document.getElementById('budget-error').style.display = 'block';
                return;
            } else {
                document.getElementById('budget-error').style.display = 'none';
            }
            
            if (!duration || duration <= 0) {
                document.getElementById('duration-error').style.display = 'block';
                return;
            } else {
                document.getElementById('duration-error').style.display = 'none';
            }
            
            // Button loading state
            predictBtn.innerText = 'Calculating...';
            predictBtn.disabled = true;
            
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `budget=${budget}&duration=${duration}`
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultValue.innerText = data.rating;
                    resultContainer.classList.add('show');
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                console.error('Fetch error:', err);
                alert('Connection error. Please try again.');
            } finally {
                predictBtn.innerText = 'Predict Rating';
                predictBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
